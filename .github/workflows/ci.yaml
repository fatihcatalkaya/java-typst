name: Java-Typst CI

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  BINARYEN_VERSION: 129

jobs:

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/main/rust -> src/main/rust/target

      - name: Install wasm-opt
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz
          sudo cp binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt /usr/local/bin/wasm-opt

      - name: Set up Java 17 + Maven
        uses: s4u/setup-maven-action@v1.20.0
        with:
          java-version: 17
          java-distribution: temurin

      - name: Build and test
        run: mvn -Prust verify -Dgpg.skip=true

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: build-test
    # Disabled in this fork — releases are cut manually with a local `mvn -Prust deploy`.
    # To re-enable, remove the `false &&` below and provide the GH_PAT secret.
    if: >-
      false &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17 + Maven
        uses: s4u/setup-maven-action@v1.20.0
        with:
          java-version: 17
          java-distribution: temurin

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npx semantic-release

  deploy:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/main/rust -> src/main/rust/target

      - name: Install wasm-opt
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz
          sudo cp binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt /usr/local/bin/wasm-opt

      - name: Set up Java 17 + Maven
        uses: s4u/setup-maven-action@v1.20.0
        with:
          java-version: 17
          java-distribution: temurin

      - name: Set up Maven Central credentials
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [{
              "id": "central",
              "username": "${{ secrets.SONATYPE_USERNAME }}",
              "password": "${{ secrets.SONATYPE_PASSWORD }}"
            }]

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6.2.0
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          trust_level: 5

      - name: Publish to Maven Central
        run: mvn -Prust deploy -DskipTests
