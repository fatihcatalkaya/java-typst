[package]
name = "java-typst"
version = "0.3.0"
edition = "2021"

[dependencies]
typst = "0.13.0"
typst-assets = { version = "0.13.0", features = ["fonts"] }
typst-pdf = "0.13.0"
# Fetching and unzipping packages
zune-inflate = { version = "0.2", default-features = false, features = [
    "gzip",
    "std",
] }
tar = "0.4"
ureq = "2.12.1"
# utils
time = "0.3"
ttf-parser = "0.25.1"

jni = "0.21.1"

[lib]
crate-type = ["cdylib"]

[target.aarch64-apple-darwin]
image = "ghcr.io/cross-rs/x86_64-apple-darwin-cross:local"

[target.x86_64-pc-windows-msvc]
image = "ghcr.io/cross-rs/x86_64-pc-windows-msvc-cross:local"
